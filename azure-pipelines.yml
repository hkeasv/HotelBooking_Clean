trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  ASPNETCORE_URLS: 'https://+:5001;http://+:5000'

steps:

# Restore NuGet dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
    
# Build the solution or projects
- task: DotNetCoreCLI@2
  displayName: 'Build Application'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--no-restore --configuration $(buildConfiguration)'

# Run Unit Tests using .NET 10 MTP Syntax
- task: DotNetCoreCLI@2
  displayName: 'Run MTP Unit Tests'
  inputs:
    command: 'custom'
    custom: 'test'
    # Note: MTP functions best when targeted directly at the test projects.
    projects: '**/*[Tt]ests/*.csproj' 
    arguments: '--configuration $(buildConfiguration) --no-build'

# Run the Web API in the background
- task: CmdLine@2
  displayName: Run the WebApi in the background
  inputs:
    script: 'dotnet $(Build.SourcesDirectory)/HotelBooking.WebApi/bin/$(buildConfiguration)/HotelBooking.WebApi.dll &'

# 1. Install Postman CLI
- task: CmdLine@2
  displayName: 'Install Postman CLI via npm'
  inputs:
    script: |
      sudo npm install -g postman-cli
      
#Run Postman tests
- task: CmdLine@2
  displayName: 'Verify and Run Postman Tests'
  inputs:
    targetType: 'inline'
    script: |
      postman --version
      postman collection run $(Build.SourcesDirectory)/Postman/HotelBooking.postman_collection.json -k -r cli
