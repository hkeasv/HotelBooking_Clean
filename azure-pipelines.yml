trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  ASPNETCORE_URLS: 'https://+:5001;http://+:5000'

steps:

# Restore NuGet dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
    
# Build the solution or projects
- task: DotNetCoreCLI@2
  displayName: 'Build Application'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--no-restore --configuration Release'

# Run the Web API in the background
- task: CmdLine@2
  displayName: Run the WebApi in the background
  inputs:
    script: 'dotnet $(Build.SourcesDirectory)/HotelBooking.WebApi/bin/$(buildConfiguration)/HotelBooking.WebApi.dll &'

# Download and install Postman CLI on Linux
- task: Bash@3
  displayName: 'Install Postman CLI'
  inputs:
    targetType: 'inline'
    script: |
      curl -o- "https://pstmn.io" | sh
      
#Run Postman tests
- task: CmdLine@2
  displayName: Run Postman tests
  inputs:
    script: 'postman collection run $(Build.SourcesDirectory)/Postman/HotelBooking.postman_collection.json -k -r cli'
